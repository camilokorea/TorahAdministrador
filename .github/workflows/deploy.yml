name: Deploy to Linode Ubuntu Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging
      force_deploy:
        description: 'Force deployment even if no changes'
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Display deployment info
      run: |
        echo "🚀 Starting deployment..."
        echo "Environment: ${{ github.event.inputs.environment || 'production' }}"
        echo "Force deploy: ${{ github.event.inputs.force_deploy || 'false' }}"
        echo "Triggered by: ${{ github.event_name }}"
        echo "Branch: ${{ github.ref_name }}"
        echo "Commit: ${{ github.sha }}"

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Clean and install dependencies
      working-directory: torah-administrador
      run: |
        rm -rf node_modules package-lock.json
        npm install

    - name: Build application
      working-directory: torah-administrador
      run: npm run build

    - name: Verify build output
      run: |
        echo "Checking build output..."
        ls -la torah-administrador/dist/
        if [ ! -f "torah-administrador/dist/index.html" ]; then
          echo "❌ index.html not found in dist/"
          exit 1
        fi
        echo "✅ Build verification successful"

    - name: Deploy to Linode server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.LINODE_HOST }}
        username: ${{ secrets.LINODE_USERNAME }}
        key: ${{ secrets.LINODE_SSH_KEY }}
        port: 22
        script: |
          # Create deployment directory if it doesn't exist
          sudo mkdir -p "${{ secrets.DEPLOY_PATH }}"
          
          # Clean previous deployment
          sudo rm -rf "${{ secrets.DEPLOY_PATH }}/*"

    - name: Create deployment archive
      run: |
        cd torah-administrador/dist
        tar -czf ../../deployment.tar.gz .

    - name: Copy files to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.LINODE_HOST }}
        username: ${{ secrets.LINODE_USERNAME }}
        key: ${{ secrets.LINODE_SSH_KEY }}
        port: 22
        source: "deployment.tar.gz"
        target: "${{ secrets.DEPLOY_PATH }}"

    - name: Extract and setup deployment
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.LINODE_HOST }}
        username: ${{ secrets.LINODE_USERNAME }}
        key: ${{ secrets.LINODE_SSH_KEY }}
        port: 22
        script: |
          # Extract deployment files to the root of deploy path
          cd "${{ secrets.DEPLOY_PATH }}"
          tar -xzf deployment.tar.gz
          
          # Remove the archive
          rm deployment.tar.gz
          
          # Set proper permissions
          sudo chown -R www-data:www-data "${{ secrets.DEPLOY_PATH }}"
          sudo chmod -R 755 "${{ secrets.DEPLOY_PATH }}"
          
          # Restart nginx
          sudo systemctl reload nginx
          
          echo "✅ Deployment completed successfully!"
          echo "📁 Files deployed to: ${{ secrets.DEPLOY_PATH }}"
          ls -la "${{ secrets.DEPLOY_PATH }}"